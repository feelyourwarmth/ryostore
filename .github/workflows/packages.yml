name: packages

# validate-catalogue.sh proves the catalogue is internally consistent; it never
# asks whether a package name is still real. cemu sat in the gaming bundle
# flagged out-of-date, and `proton-cachyos` became unresolvable upstream after
# CachyOS split it into -slr and -native. Both would have shipped.
#
# This runs on a schedule rather than on every push: a package disappearing is
# drift in someone else's repo, not a regression in a commit, so it must not fail
# a PR that never touched a manifest. Upstream being unreachable is reported and
# skipped, never a failure.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Every bundle package resolves to its declared source
        run: python3 tests/verify-packages.py
